name: Daily events rebuild
on:
  schedule:
    - cron: "0 11 * * *"   # about 3 AM Pacific
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python3 tools/build_events.py && python3 tools/build_programs.py
      - run: |
          git config user.name "events-bot"; git config user.email "events-bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || (git commit -m "Daily events rebuild" && git push)
